<!doctype html>
<html>
  <head>
    <title>AeroDrift Dashboard</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>

  <body>
    <header class="top-header">
      <h1>AeroDrift Dashboard</h1>
      <p>Cloud Infrastructure Monitoring</p>
    </header>

    <div class="dashboard">
      <div class="card">
        <h2>Topology</h2>
        <p class="card-description">Cloud resource relationships</p>
        <div id="topology">Loading topology...</div>
      </div>

      <!-- <h2>Topology</h2>
    <div id="topology">Loading topology...</div> -->

      <div class="card">
        <h2>Drift</h2>
        <p class="card-description">Infrastructure configuration changes</p>
        <div id="drift">Loading drift...</div>
      </div>
      <!-- <h2>Drift</h2>
    <div id="drift">Loading drift...</div> -->

      <div class="card">
        <h2>Remediation</h2>
        <p class="card-description">Actions taken to resolve drift</p>
        <div id="remediation">Loading remediation...</div>
      </div>
    </div>
    <!-- <h2>Remediation</h2>
    <div id="remediation">Loading remediation...</div> -->

    <script>
      async function loadTopology() {
        try {
          const response = await fetch("/topology");
          const data = await response.json();

          document.getElementById("topology").innerHTML = `
                <p><strong>Nodes:</strong> ${data.nodes.length}</p>
                <p><strong>Edges:</strong> ${data.edges.length}</p>
            `;
        } catch (error) {
          document.getElementById("topology").innerHTML =
            "Unable to load topology data.";
        }
      }

      loadTopology();
    </script>

   <script>
  async function loadDrift() {
    try {
      const params = new URLSearchParams(window.location.search);
      const demoMode = params.get("demo") === "true";

      const endpoint = demoMode ? "/drift-demo" : "/drift";

      const response = await fetch(endpoint);
      const data = await response.json();

      let driftHtml = `
        <p><strong>Drift Count:</strong> ${data.drift_count}</p>
        <p><strong>Issues:</strong> ${data.issues.length}</p>
      `;

      if (demoMode) {
        driftHtml =
          `<p style="color:#d32f2f; font-weight:bold;">
            SIMULATED DEMO - CRITICAL DRIFT DETECTED
          </p>` + driftHtml;
      }

      if (data.issues.length > 0) {
        const issue = data.issues[0];

        driftHtml += `
          <hr>
          <p style="color:#d32f2f;">
            <strong>Severity:</strong> ${issue.severity}
          </p>
          <p><strong>Event:</strong> ${issue.event_type}</p>
          <p><strong>Resource:</strong> ${issue.resource_id}</p>
          <p><strong>Public CIDR:</strong> ${issue.cidr}</p>
          <p>
            <strong>Port:</strong>
            ${issue.from_port} - ${issue.to_port}
          </p>
        `;
      }

      document.getElementById("drift").innerHTML = driftHtml;

    } catch (error) {
      document.getElementById("drift").innerHTML =
        "Unable to load drift data.";
    }
  }

  loadDrift();
</script>
    <script>
      async function loadRemediation() {
        try {
          const response = await fetch("/remediation");
          const data = await response.json();

          document.getElementById("remediation").innerHTML = `
                <p><strong>Remediation Count:</strong> ${data.remediation_count}</p>
                <p><strong>Actions:</strong> ${data.actions.length}</p>
            `;
        } catch (error) {
          document.getElementById("remediation").innerHTML =
            "Unable to load remediation data.";
        }
      }

      loadRemediation();
    </script>
  </body>
</html>
